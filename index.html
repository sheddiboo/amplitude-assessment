<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Energy Data Insights</title>
    
    <!-- Official Amplitude SDK & Initialization -->
    <script src="https://cdn.eu.amplitude.com/script/f042ddd6ddb02894d4f1694e19e5d8a3.js"></script>
    <script>
        window.amplitude.add(window.sessionReplay.plugin({sampleRate: 1}));
        window.amplitude.init('f042ddd6ddb02894d4f1694e19e5d8a3', {
            "fetchRemoteConfig": true,
            "serverZone": "EU",
            "autocapture": {
                "attribution": {"trackingMethod": ["userProperty", "eventProperty"]},
                "fileDownloads": true,
                "formInteractions": true,
                "pageViews": true,
                "sessions": true,
                "elementInteractions": true,
                "networkTracking": true,
                "webVitals": true,
                "frustrationInteractions": {
                    "thrashedCursor": true,
                    "errorClicks": true,
                    "deadClicks": true,
                    "rageClicks": true
                }
            }
        });
    </script>
</head>
<body>
    <h1>Energy Data Insights</h1>
    <button id="signup-btn">Sign Up</button>
    <button id="demo-btn">Request Demo</button>

    <script>
        document.getElementById('signup-btn').addEventListener('click', () => {
            window.amplitude.track('Sign Up Clicked');
        });
        document.getElementById('demo-btn').addEventListener('click', () => {
            window.amplitude.track('Request Demo Clicked');
        });
    </script>
</body>
</html>
